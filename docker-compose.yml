
services:
  backend1:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 5050
    expose:
      - "5050"

  backend2:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 5050
    expose:
      - "5050"

  backend3:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 5050
    expose:
      - "5050"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
